<title>NEXORA 完整循環圖：籌資、現金樞紐、營運循環（營運/物流/金流三軌）</title>
<desc>頂部籌資三源匯入現金樞紐，現金流出到設備薪資還款分紅；營運循環分三軌——左營運決策不動帳、中物流實體貨物、右金流帳務，收貨生應付、出貨簽收生應收，付款收款迴流現金。過帳事件框標注借貸分錄樣板。</desc>
